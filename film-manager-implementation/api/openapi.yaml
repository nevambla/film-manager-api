openapi: 3.0.1
info:
  title: Film Manager
  description: REST APIs for the interaction with the Film Manager service.
  termsOfService: http://swagger.io/terms/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:3001/
tags:
  - name: api
    description: entry point of the REST interface
  - name: api/films
    description: the set of all the films
  - name: api/films/private
    description: the set of all the private films
  - name: api/films/private/{filmId}
    description: the private film with ID filmId
  - name: api/films/public
    description: the set of all the public films
  - name: api/films/public/invited
    description: the set of the public films for which a review invitation has been issued
  - name: api/films/public/invitations
    description: the authenticated user's invitations
  - name: api/films/public/invitations/accept
    description: bulk accept pending invitations of the authenticated user
  - name: api/films/public/{filmId}
    description: the public film with ID filmId
  - name: api/films/public/{filmId}/invitations
    description: the invitations issued for the public film with ID filmId
  - name: api/films/public/{filmId}/invitations/{reviewerId}
    description: >-
      the invitation issued to the user with ID reviewerId for the public film
      with ID filmId
  - name: api/films/public/{filmId}/invitations/accept
    description: accept an invitation for the public film with ID filmId
  - name: api/films/public/{filmId}/reviews
    description: the review completed for the public film with ID filmId
  - name: api/films/public/{filmId}/reviews/{reviewerId}
    description: >-
      the review completed by the user with ID reviewerId for the public film
      with ID filmId
  - name: api/films/public/assignments
    description: the assignments of review invitations to users
  - name: api/users
    description: the set of all the users
  - name: api/users/authenticator
    description: the authenticator
  - name: api/users/authenticator/current
    description: the authenticator current session
  - name: api/users/{userId}
    description: the user with ID userId
paths:
  /api:
    get:
      tags:
        - api
      summary: Retrieve the Film Manager
      description: >-
        The Film Manager resource, representing the entry point of the REST
        interface, with ID filmId is retrieved. This operation does not require
        authentication.
      operationId: getFilmManager
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilmManager'
        '500':
          description: Internal Server Error
          content: {}
  /api/films:
    post:
      tags:
        - api/films
      security:
        - cookieAuth: []
      summary: Create a new film
      description: A new film is created by the authenticated user (who becomes the owner).
      operationId: createFilm
      requestBody:
        description: >-
          Representation of the film to be created (with no id because it is
          assigned by the service)
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Film'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Film'
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/private:
    get:
      tags:
        - api/films/private
      security:
        - cookieAuth: []
      summary: Retrieve the private films of the logged-in user
      description: >-
        The private films of the logged-in user are retrieved. A pagination
        mechanism is used to limit the size of messages.
      operationId: getPrivateFilms
      parameters:
        - in: query
          name: pageNo
          required: false
          schema:
            type: integer
          description: The id of the requested page (if absent, the first page is returned)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Films'
        '401':
          description: Unauthorized
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/private/{filmId}:
    get:
      tags:
        - api/films/private/{filmId}
      security:
        - cookieAuth: []
      summary: Retrieve a private film
      description: >-
        The private film with ID filmId is retrieved. This operation can be
        performed on the film if the user who performs the operation is the
        film's owner.
      operationId: getSinglePrivateFilm
      parameters:
        - name: filmId
          in: path
          description: ID of the film to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Film'
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
    put:
      tags:
        - api/films/private/{filmId}
      security:
        - cookieAuth: []
      summary: Update a private film
      description: >-
        The private film with ID filmId is updated. This operation does not
        allow changing its visibility. This operation can be performed only by
        the owner.
      operationId: updateSinglePrivateFilm
      parameters:
        - name: filmId
          in: path
          description: ID of the film to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The updated film object that needs to replace the old object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Film'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '409':
          description: Conflict (attempt to make unallowed change, e.g., visibility)
          content: {}
        '500':
          description: Internal Server Error
          content: {}
    delete:
      tags:
        - api/films/private/{filmId}
      security:
        - cookieAuth: []
      summary: Delete a private film
      description: >-
        The private film with ID filmId is deleted. This operation can only be
        performed by the owner.
      operationId: deleteSinglePrivateFilm
      parameters:
        - name: filmId
          in: path
          description: ID of the film to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Successful operation - No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public:
    get:
      tags:
        - api/films/public
      summary: Retrieve the public films
      description: >-
        The public films (i.e., the films that are visible for all the users of
        the service) are retrieved. This operation does not require
        authentication. A pagination mechanism is used to limit the size of
        messages.
      operationId: getPublicFilms
      parameters:
        - in: query
          name: pageNo
          required: false
          schema:
            type: integer
          description: The id of the requested page (if absent, the first page is returned)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Films'
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/invited:
    get:
      tags:
        - api/films/public/invited
      security:
        - cookieAuth: []
      summary: >-
        Retrieve the public films that the logged-in user has been invited to
        review
      description: >-
        The public films that the logged-in user has been invited to review are
        retrieved. A pagination mechanism is used to limit the size of messages.
      operationId: getInvitedFilms
      parameters:
        - in: query
          name: pageNo
          required: false
          schema:
            type: integer
          description: The id of the requested page (if absent, the first page is returned)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Films'
        '401':
          description: Unauthorized
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/invitations:
    get:
      tags:
        - api/films/public/invitations
      security:
        - cookieAuth: []
      summary: Retrieve all invitations of the authenticated user
      description: >-
        Retrieves the invitations of the authenticated user (reviewer). Results
        can be filtered to avoid transferring unnecessary information (e.g.,
        only pending invitations). A pagination mechanism is used to limit the
        size of messages. Expired invitations are cancelled before retrieving.
      operationId: getMyInvitations
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
          description: >-
            Filter by status. Supports one or multiple values separated by
            commas (e.g., PENDING or PENDING,ACCEPTED).
        - in: query
          name: filmId
          required: false
          schema:
            type: integer
          description: Filter invitations for a specific film.
        - in: query
          name: expiresBefore
          required: false
          schema:
            type: string
            format: date-time
          description: Return invitations whose expiresAt is <= this date-time.
        - in: query
          name: expiresAfter
          required: false
          schema:
            type: string
            format: date-time
          description: Return invitations whose expiresAt is >= this date-time.
        - in: query
          name: pageNo
          required: false
          schema:
            type: integer
            minimum: 1
          description: The requested page number (if absent, the first page is returned).
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationsResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
  /api/films/public/invitations/accept:
    post:
      tags:
        - api/films/public/invitations/accept
      security:
        - cookieAuth: []
      summary: Accept all my pending invitations (bulk)
      description: >-
        The authenticated user accepts all their pending invitations. Expired
        invitations are cancelled before accepting.
      operationId: acceptAllMyPendingInvitations
      responses:
        '200':
          description: Bulk accept completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAcceptInvitationsResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
  /api/films/public/{filmId}:
    get:
      tags:
        - api/films/public/{filmId}
      summary: Retrieve a public film
      description: >-
        The public film with ID filmId is retrieved. This operation does not
        require authentication.
      operationId: getSinglePublicFilm
      parameters:
        - name: filmId
          in: path
          description: ID of the film to retrieve
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Film'
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
    put:
      tags:
        - api/films/public/{filmId}
      security:
        - cookieAuth: []
      summary: Update a public film
      description: >-
        The public film with ID filmId is updated. This operation does not allow
        changing its visibility. This operation can be performed only by the
        owner.
      operationId: updateSinglePublicFilm
      parameters:
        - name: filmId
          in: path
          description: ID of the film to update
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The updated film object that needs to replace the old object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Film'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '409':
          description: Conflict (attempt to make unallowed change, e.g., visibility)
          content: {}
        '500':
          description: Internal Server Error
          content: {}
    delete:
      tags:
        - api/films/public/{filmId}
      security:
        - cookieAuth: []
      summary: Delete a public film
      description: >-
        The public film with ID filmId is deleted. This operation can only be
        performed by the owner.
      operationId: deleteSinglePublicFilm
      parameters:
        - name: filmId
          in: path
          description: ID of the film to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Successful operation - No Content
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/{filmId}/invitations:
    get:
      tags:
        - api/films/public/{filmId}/invitations
      security:
        - cookieAuth: []
      summary: Retrieve invitations for a public film (owner only)
      description: >-
        The owner retrieves the invitations issued for the public film with ID
        filmId. Optional filters can be used to reduce unnecessary information
        transfer. A pagination mechanism is used to limit the size of messages.
      operationId: getFilmInvitationsOwner
      parameters:
        - name: filmId
          in: path
          description: ID of the public film
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: >-
            Comma-separated list of statuses to filter (e.g.,
            PENDING,ACCEPTED,CANCELLED)
          required: false
          schema:
            type: string
        - name: includeCompleted
          in: query
          description: 'If true, include completed reviews too (default: false)'
          required: false
          schema:
            type: boolean
        - name: expiresAfter
          in: query
          required: false
          schema:
            type: string
          description: >-
            Return invitations whose expiresAt is >= this datetime (SQLite
            datetime string).
        - name: expiresBefore
          in: query
          required: false
          schema:
            type: string
          description: >-
            Return invitations whose expiresAt is <= this datetime (SQLite
            datetime string).
        - name: acceptedAfter
          in: query
          required: false
          schema:
            type: string
          description: >-
            Return invitations accepted at or after this datetime (SQLite
            datetime string).
        - name: acceptedBefore
          in: query
          required: false
          schema:
            type: string
          description: >-
            Return invitations accepted at or before this datetime (SQLite
            datetime string).
        - name: pageNo
          in: query
          description: The id of the requested page (if absent, the first page is returned)
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  pagination:
                    type: object
                    additionalProperties: false
                    properties:
                      currentPage:
                        type: integer
                      pageSize:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                  _links:
                    type: object
                required:
                  - invitations
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
    post:
      tags:
        - api/films/public/{filmId}/invitations
      security:
        - cookieAuth: []
      summary: Issue invitations for a public film (owner only)
      description: >-
        The owner issues one or more review invitations for the public film with
        ID filmId. If expiresAt is not provided, the service sets a far-future
        expiration time.
      operationId: issueInvitations
      parameters:
        - name: filmId
          in: path
          description: ID of the public film
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/InvitationCreate'
            examples:
              withExpiration:
                summary: Two invitations with explicit expiration
                value:
                  - reviewerId: 3
                    expiresAt: '2026-02-01T12:00:00'
                  - reviewerId: 4
                    expiresAt: '2026-03-01T12:00:00'
              withoutExpiration:
                summary: Invitation without expiresAt (default far-future expiration)
                value:
                  - reviewerId: 5
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                required:
                  - invitations
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '409':
          description: >-
            Conflict (the owner cannot invite himself or invitation already
            exists)
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/{filmId}/invitations/{reviewerId}:
    delete:
      tags:
        - api/films/public/{filmId}/invitations/{reviewerId}
      security:
        - cookieAuth: []
      summary: Cancel a review invitation
      description: >-
        Cancels the invitation for reviewerId on public filmId. Only the owner
        can cancel, and only if not completed.
      operationId: cancelInvitation
      parameters:
        - name: filmId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: reviewerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (user is not the owner)
          content: {}
        '404':
          description: Not Found
          content: {}
        '409':
          description: Conflict (already completed)
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/{filmId}/invitations/accept:
    post:
      tags:
        - api/films/public/{filmId}/invitations/accept
      security:
        - cookieAuth: []
      summary: Accept a review invitation
      description: >-
        The authenticated user accepts the pending invitation for the public
        film with ID filmId. The reviewer is the authenticated user (taken from
        the session).
      operationId: acceptInvitation
      parameters:
        - name: filmId
          in: path
          description: ID of the film whose invitation must be accepted
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          description: Bad Request (invalid parameters or request format)
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (the authenticated user is not the invited reviewer)
          content: {}
        '404':
          description: Not Found (invitation does not exist)
          content: {}
        '409':
          description: >-
            Conflict (invitation cannot be PENDING, already ACCEPTED, CANCELLED
            or COMPLETED)
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/{filmId}/reviews:
    get:
      tags:
        - api/films/public/{filmId}/reviews
      summary: >-
        Retrieve the list of all the reviews that have been completed for a
        public film
      description: >-
        All the reviews that have been completed for the public film with ID
        filmId are retrieved. A pagination mechanism is used to limit the size
        of messages. This operation does not require authentication. 
      operationId: getFilmReviews
      parameters:
        - name: filmId
          in: path
          description: ID of the film whose reviews must be retrieved
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: pageNo
          required: false
          schema:
            type: integer
          description: ID of the requested page (if absent, the first page is returned)'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reviews'
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/{filmId}/reviews/{reviewerId}:
    get:
      tags:
        - api/films/public/{filmId}/reviews/{reviewerId}
      summary: Retrieve a review that has been completed for a film
      description: >-
        The review of the film with ID filmID completed by the user with ID
        reviewerId is retrieved. This operation does not require
        authentication. 
      operationId: getSingleReview
      parameters:
        - name: filmId
          in: path
          description: ID of the film whose reviews must be retrieved
          required: true
          schema:
            type: integer
            format: int64
        - name: reviewerId
          in: path
          description: ID of the user to whom the review has been issued
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '404':
          description: Not Found
          content: {}
        '500':
          description: Internal Server Error
          content: {}
    put:
      tags:
        - api/films/public/{filmId}/reviews/{reviewerId}
      security:
        - cookieAuth: []
      summary: Complete or modify a review
      description: >-
        The review of the film with ID filmId and issued to the user with ID
        reviewerId is completed. This operation only allows setting the
        "completed" property to the "true" value, and changing the values of the
        "reviewDate", "rating", and "review" properties. This operation can be
        performed only by the invited reviewer.
      operationId: updateSingleReview
      parameters:
        - name: filmId
          in: path
          description: ID of the film whose review must be completed
          required: true
          schema:
            type: integer
            format: int64
        - name: reviewerId
          in: path
          description: ID of the user to whom the review has been issued
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: The updated Review object
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '403':
          description: Forbidden (the user is not the reviewer)
          content: {}
        '404':
          description: Not Found
          content: {}
        '409':
          description: Conflict
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/films/public/assignments:
    post:
      tags:
        - api/films/public/assignments
      security:
        - cookieAuth: []
      summary: >-
        Assign automatically review invitations for the unassigned public films
        owned by the authenticated user in a balanced manner
      description: >-
        The films owned by the authenticated user who performed the request and
        that are not assigned to any user for review, are automatically assigned
        to the users of the service in a balanced manner. The assignments are
        returned. Only authenticated users can make this request.
      operationId: assignReviewBalanced
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  properties:
                    filmId:
                      type: integer
                    reviewerId:
                      type: integer
        '401':
          description: Unauthorized
          content: {}
        '500':
          description: Internal Server Error
          content: {}
  /api/users:
    get:
      tags:
        - api/users
      security:
        - cookieAuth: []
      summary: Get information about the users
      description: >-
        The available information (passwords excluded) about all the users is
        retrieved. This operation is available only to authenticated users.
      operationId: getUsers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
  /api/users/{userId}:
    get:
      tags:
        - api/users/{userId}
      security:
        - cookieAuth: []
      summary: Get information about a user
      description: >-
        The available information (password excluded) about the user specified
        by userId is retrieved. This operation requires authentication.
      operationId: getSingleUser
      parameters:
        - name: userId
          in: path
          description: ID of the user to get
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content: {}
        '404':
          description: Not Found
          content: {}
  /api/users/authenticator:
    post:
      tags:
        - api/users/authenticator
      summary: Logs a user in
      description: >-
        The user who wants to log in sends the user data to the authenticator
        which performs the operation. If the request for the login of a new user
        comes from an already authenticated user, the previous user is first
        logged out.
      operationId: authenticateUser
      requestBody:
        description: >-
          The data of the user who wants to perform log in. The data structure
          must contain email and password.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '200':
          description: Successful operation
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=abcde12345; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content: {}
        '401':
          description: Unauthorized
          content: {}
  /api/users/authenticator/current:
    delete:
      tags:
        - api/users/authenticator/current
      summary: Logs the current user out
      description: >-
        Invalidates the current user session. Removes the authentication cookie
        if present.
      operationId: logoutUser
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
components:
  schemas:
    FilmManager:
      description: schema for FilmManager data structure (api entry point)
      type: object
      additionalProperties: false
      properties:
        films:
          type: string
          description: URI to access the api/films endpoint
          format: uri
        privateFilms:
          type: string
          description: URI to access the api/films/private endpoint
          format: uri
        publicFilms:
          type: string
          description: URI to access the api/films/public endpoint
          format: uri
        invitedPublicFilms:
          type: string
          format: uri
          description: URI to access the api/films/public/invited endpoint
        reviewAssignments:
          type: string
          description: URI to access the api/films/public/assignments endpoint
          format: uri
        users:
          type: string
          description: URI to access the api/users endpoint
          format: uri
        usersAuthenticator:
          type: string
          description: URI to access the api/users/authenticator endpoint
          format: uri
    User:
      description: schema for User data structures
      type: object
      additionalProperties: false
      properties:
        $schema:
          type: string
          description: >-
            path to the JSON Schema to use for the validation of the JSON data
            structure describing the user
        id:
          type: integer
          description: unique identifier for the user
        email:
          type: string
          format: email
          description: user email
        name:
          type: string
          description: username
        password:
          type: string
          minLength: 6
          maxLength: 20
          description: user password
        self:
          type: string
          format: uri
      required:
        - email
    Users:
      description: schema for Users data structures
      type: array
      items:
        $ref: '#/components/schemas/User'
    Film:
      description: schema for Film data structures
      type: object
      additionalProperties: false
      properties:
        $schema:
          type: string
          description: >-
            path to the JSON Schema to use for the validation of the JSON data
            structure describing the film
        id:
          type: integer
          description: unique identifier for the film data structure
        title:
          type: string
          description: textual title of the film
        owner:
          type: integer
          description: unique identifier of the the film data structure owner
        private:
          type: boolean
          description: >-
            true if only the owner of the film data structure can access it,
            false otherwise
          default: 'true'
        watchDate:
          type: string
          format: date
          description: the date when the film was watched by the owner
        rating:
          type: integer
          description: the rating the owner has given to the film
          minimum: 1
          maximum: 10
        favorite:
          type: boolean
          description: >-
            true if the film is among the favourite ones of the owner, false
            otherwise 
          default: 'false'
        self:
          type: string
          format: uri
        reviews:
          type: string
          format: uri
          description: the reviews for the film
      required:
        - title
        - owner
        - private
    Films:
      description: schema for Films data structures
      type: object
      additionalProperties: false
      properties:
        $schema:
          type: string
          description: >-
            path to the JSON Schema to use for the validation of the JSON data
            structure describing the films
        totalPages:
          type: integer
          minimum: 0
          description: total number of pages
        currentPage:
          type: integer
          minimum: 0
          description: the page included in this object
        totalItems:
          type: integer
          minimum: 0
          description: the total number of items in the current page
        films:
          type: array
          items:
            $ref: '#/components/schemas/Film'
          description: the films of the current page
        next:
          type: string
          format: uri
      required:
        - totalPages
    Review:
      description: schema for Review data structures
      type: object
      additionalProperties: false
      properties:
        $schema:
          type: string
          description: >-
            path to the JSON Schema to use for the validation of the JSON data
            structure describing the film
        completed:
          type: boolean
          description: true if the review has been completed, false otherwise
          default: 'false'
        reviewDate:
          type: string
          format: date
          description: the date when the review has been completed by the invited user
        rating:
          type: integer
          description: the rating the reviewer has given to the film
          minimum: 1
          maximum: 10
        review:
          type: string
          description: a textual description of the review
          maxLength: 1000
      required:
        - filmId
        - reviewerId
    Reviews:
      description: schema for Reviews data structures
      type: object
      additionalProperties: false
      properties:
        $schema:
          type: string
          description: >-
            path to the JSON Schema to use for the validation of the JSON data
            structure describing the reviews
        totalPages:
          type: integer
          minimum: 0
          description: total number of pages
        currentPage:
          type: integer
          minimum: 0
          description: the page included in this object
        totalItems:
          type: integer
          minimum: 0
          description: the total number of items in the current page
        films:
          type: array
          items:
            $ref: '#/components/schemas/Review'
          description: the reviews of the current page
        next:
          type: string
          format: uri
      required:
        - totalPages
    InvitationCreate:
      description: schema for creating an invitation
      type: object
      additionalProperties: false
      properties:
        reviewerId:
          type: integer
          description: ID of the invited reviewer
        expiresAt:
          type: string
          format: date-time
          description: Expiration timestamp of the invitation (optional)
      required:
        - reviewerId
    Invitation:
      type: object
      additionalProperties: false
      properties:
        filmId:
          type: integer
        reviewerId:
          type: integer
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - CANCELLED
        expiresAt:
          type: string
          nullable: true
        acceptedAt:
          type: string
          nullable: true
        _links:
          type: object
          additionalProperties: false
          properties:
            self:
              $ref: '#/components/schemas/Link'
            film:
              $ref: '#/components/schemas/Link'
            review:
              $ref: '#/components/schemas/Link'
      required:
        - filmId
        - reviewerId
        - status
        - _links
    InvitationsResponse:
      type: object
      additionalProperties: false
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        _links:
          type: object
          additionalProperties: false
          properties:
            self:
              $ref: '#/components/schemas/Link'
            prev:
              $ref: '#/components/schemas/Link'
            next:
              $ref: '#/components/schemas/Link'
      required:
        - pagination
        - invitations
        - _links
    BulkAcceptInvitationsResponse:
      type: object
      additionalProperties: false
      required:
        - bulkAcceptedCount
        - myCurrentAcceptedInvitations
      properties:
        bulkAcceptedCount:
          type: integer
          minimum: 0
          description: Number of invitations accepted by this bulk operation.
        myCurrentAcceptedInvitations:
          type: array
          description: >-
            Current accepted (and not completed) invitations of the
            authenticated user.
          items:
            $ref: '#/components/schemas/Invitation'
      example:
        bulkAcceptedCount: 2
        myCurrentAcceptedInvitations:
          - filmId: 4
            reviewerId: 1
            status: ACCEPTED
            expiresAt: null
            acceptedAt: '2026-01-13 21:46:29'
            _links:
              self:
                href: /api/films/public/invitations/4/1
              film:
                href: /api/films/public/4
              review:
                href: /api/films/public/4/reviews/1
                method: PUT
    Pagination:
      type: object
      additionalProperties: false
      properties:
        currentPage:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 1
      required:
        - currentPage
        - pageSize
        - totalItems
        - totalPages
    Link:
      type: object
      additionalProperties: false
      properties:
        href:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
      required:
        - href
  securitySchemes:
    cookieAuth:
      description: JWT to identify the authenticated user.
      type: apiKey
      in: cookie
      name: connect.sid
